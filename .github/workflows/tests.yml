name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
          - os: ubuntu-24.04-arm
            container: ghcr.io/homebrew/ubuntu24.04:latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Tap external dependencies
        run: |
          brew tap dimpase/gap
          brew tap macaulay2/tap
          brew trust --tap dimpase/gap macaulay2/tap

      - name: Install patched PARI
        run: brew install dimpase/tap/pari

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      # test-bot skips formulae whose dependencies have no compatible bottles.
      # Sage uses several such tap dependencies; exercise its source build too.
      - name: Build and test Sage from source
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if git diff --quiet "origin/$BASE_REF" HEAD -- Formula/s/sagemath.rb; then
            exit 0
          fi
          brew install dimpase/tap/pari
          # test-bot can leave Sage installed after removing its dependencies.
          brew install --only-dependencies --include-test dimpase/tap/sagemath
          brew install --build-from-source dimpase/tap/sagemath
          brew test dimpase/tap/sagemath

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
