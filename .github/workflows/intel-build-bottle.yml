name: Build Intel Sequoia bottle
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name in dimpase/tap
        required: true
        default: cliquer
        type: string
permissions:
  contents: read
concurrency:
  group: intel-sequoia-build
  cancel-in-progress: false
jobs:
  bottle:
    if: github.repository == 'dimpase/homebrew-tap' && github.actor == 'dimpase' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, X64, brew-intel-sequoia]
    timeout-minutes: 180
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test bottle
        shell: bash
        env:
          FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          python3 scripts/intel-build-bottle.py --formula "$FORMULA" --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/intel-bottles"
      - name: Upload bottle and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: intel-sequoia-bottle-${{ github.run_id }}
          path: ${{ runner.temp }}/intel-bottles/
          if-no-files-found: warn
          retention-days: 30
