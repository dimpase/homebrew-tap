name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: brew-test-bot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
          - os: ubuntu-24.04-arm
            container: ghcr.io/homebrew/ubuntu24.04:latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Tap external dependencies
        run: |
          brew tap dimpase/gap
          brew tap macaulay2/tap
          brew trust --tap dimpase/gap macaulay2/tap

      - name: Install patched PARI
        run: brew install dimpase/tap/pari

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      # test-bot skips formulae whose dependencies have no compatible bottles.
      # Build and test changed formulae anyway, and bottle any skipped ones.
      - name: Build and test changed formulae from source
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          while IFS= read -r formula_path; do
            [[ -f "$formula_path" ]] || continue
            formula_name="${formula_path##*/}"
            formula_name="${formula_name%.rb}"
            formula="dimpase/tap/$formula_name"
            # test-bot can leave formulae installed after removing dependencies.
            brew install --only-dependencies --include-test "$formula"
            brew install --build-bottle "$formula"
            brew test "$formula"
            if ! compgen -G "$formula_name*.bottle.json" > /dev/null; then
              pkg_version=$(brew ruby -e 'puts Formulary.factory(ARGV.fetch(0)).pkg_version' "$formula")
              brew bottle --json --root-url="https://github.com/dimpase/homebrew-tap/releases/download/$formula_name-$pkg_version" "$formula"
            fi
          done < <(git diff --name-only "origin/$BASE_REF"...HEAD -- 'Formula/*.rb' 'Formula/**/*.rb')

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
